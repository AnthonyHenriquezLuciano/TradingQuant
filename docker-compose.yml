services:
  engine:
    build: ./apps/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TRADINGQUANT_DATA_DIR: /data/uploads
      TRADINGQUANT_CORS_ORIGINS: http://localhost:3000
      NUMBA_CACHE_DIR: /var/cache/numba
    volumes:
      - tradingquant_datasets:/data/uploads
      - tradingquant_numba:/var/cache/numba
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 3

volumes:
  tradingquant_datasets:
  tradingquant_numba:
